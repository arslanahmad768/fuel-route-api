[project]
name = "fuel-route-api"
version = "0.1.0"
description = "Django API for fuel route optimization"
authors = [
    { email = "arslanahmaddeve@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework",
    "python-dotenv>=1.2.3",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "responses",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["."]
